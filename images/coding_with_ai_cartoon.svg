<svg viewBox="0 0 720 500" xmlns="http://www.w3.org/2000/svg" font-family="'Comic Sans MS', 'Chalkboard SE', cursive">

  <!-- Background -->
  <rect width="720" height="500" fill="#f0f7ff"/>

  <!-- ===== LEFT PANEL ===== -->
  <rect x="20" y="15" width="315" height="390" rx="14" fill="white" stroke="#333" stroke-width="3"/>

  <!-- Desk -->
  <rect x="55" y="295" width="240" height="12" rx="4" fill="#b5835a" stroke="#7a5230" stroke-width="2"/>
  <rect x="75" y="307" width="12" height="45" fill="#b5835a" stroke="#7a5230" stroke-width="2"/>
  <rect x="263" y="307" width="12" height="45" fill="#b5835a" stroke="#7a5230" stroke-width="2"/>

  <!-- Laptop -->
  <rect x="110" y="245" width="130" height="52" rx="6" fill="#1a1a2e" stroke="#444" stroke-width="2"/>
  <rect x="115" y="249" width="120" height="43" rx="4" fill="#0f3460"/>
  <rect x="121" y="255" width="55" height="4" rx="2" fill="#4ade80"/>
  <rect x="121" y="263" width="85" height="4" rx="2" fill="#60a5fa"/>
  <rect x="121" y="271" width="42" height="4" rx="2" fill="#f472b6"/>
  <rect x="121" y="279" width="70" height="4" rx="2" fill="#facc15"/>
  <rect x="100" y="297" width="150" height="8" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- AI Robot -->
  <rect x="58" y="205" width="50" height="60" rx="8" fill="#6366f1" stroke="#4338ca" stroke-width="2"/>
  <rect x="61" y="170" width="44" height="38" rx="8" fill="#818cf8" stroke="#4338ca" stroke-width="2"/>
  <circle cx="73" cy="185" r="6" fill="white"/>
  <circle cx="93" cy="185" r="6" fill="white"/>
  <circle cx="75" cy="186" r="3" fill="#1e1b4b"/>
  <circle cx="95" cy="186" r="3" fill="#1e1b4b"/>
  <line x1="83" y1="170" x2="83" y2="153" stroke="#4338ca" stroke-width="2.5"/>
  <circle cx="83" cy="149" r="5" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <path d="M71 195 Q83 203 95 195" fill="none" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="220" x2="40" y2="240" stroke="#4338ca" stroke-width="4" stroke-linecap="round"/>
  <line x1="108" y1="220" x2="126" y2="240" stroke="#4338ca" stroke-width="4" stroke-linecap="round"/>
  <rect x="64" y="213" width="38" height="15" rx="4" fill="#312e81"/>
  <text x="83" y="224" text-anchor="middle" font-size="10" font-weight="bold" fill="white">AI</text>
  <rect x="66" y="263" width="13" height="24" rx="5" fill="#4338ca"/>
  <rect x="84" y="263" width="13" height="24" rx="5" fill="#4338ca"/>

  <!-- Student (left panel) -->
  <rect x="218" y="210" width="50" height="65" rx="8" fill="#fb923c" stroke="#c2410c" stroke-width="2"/>
  <circle cx="243" cy="190" r="25" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <path d="M218 180 Q224 160 243 165 Q262 160 268 180" fill="#7c3aed" stroke="#5b21b6" stroke-width="1.5"/>
  <circle cx="235" cy="188" r="4" fill="white"/>
  <circle cx="251" cy="188" r="4" fill="white"/>
  <circle cx="236" cy="189" r="2" fill="#1c1917"/>
  <circle cx="252" cy="189" r="2" fill="#1c1917"/>
  <path d="M234 198 Q243 205 252 198" fill="none" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
  <line x1="218" y1="225" x2="200" y2="247" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>
  <line x1="268" y1="225" x2="280" y2="247" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>
  <rect x="223" y="273" width="13" height="24" rx="5" fill="#c2410c"/>
  <rect x="244" y="273" width="13" height="24" rx="5" fill="#c2410c"/>

  <!-- AI speech bubble -->
  <ellipse cx="150" cy="115" rx="62" ry="30" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <polygon points="118,142 110,158 132,148" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="150" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730a3">Here's your</text>
  <text x="150" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730a3">code! ✨</text>

  <!-- Student speech bubble (left) -->
  <ellipse cx="292" cy="108" rx="52" ry="26" fill="#fef9c3" stroke="#d97706" stroke-width="2"/>
  <polygon points="270,132 263,147 284,137" fill="#fef9c3" stroke="#d97706" stroke-width="1.5"/>
  <text x="292" y="103" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">Thanks!</text>
  <text x="292" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">So fast 🤩</text>

  <!-- Left caption -->
  <rect x="28" y="348" width="298" height="46" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="177" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">✅ AI codes fast.</text>
  <text x="177" y="385" text-anchor="middle" font-size="12" fill="#065f46">Using AI to generate code? Totally fine!</text>

  <!-- Arrow -->
  <text x="360" y="225" text-anchor="middle" font-size="42" fill="#94a3b8">→</text>

  <!-- ===== RIGHT PANEL ===== -->
  <rect x="385" y="15" width="315" height="390" rx="14" fill="white" stroke="#333" stroke-width="3"/>

  <!-- Broken laptop -->
  <rect x="408" y="248" width="105" height="65" rx="6" fill="#1a1a2e" stroke="#444" stroke-width="2"/>
  <rect x="413" y="252" width="95" height="57" rx="4" fill="#0f172a"/>
  <text x="460" y="272" text-anchor="middle" font-size="9" fill="#ef4444" font-weight="bold">ERROR!</text>
  <text x="460" y="285" text-anchor="middle" font-size="8" fill="#fca5a5">object not found</text>
  <text x="460" y="298" text-anchor="middle" font-size="8" fill="#fca5a5">NaN  NaN  NaN</text>
  <text x="460" y="312" text-anchor="middle" font-size="9" fill="#facc15">p = 0.049 🤔</text>

  <!-- Confused student (right panel) -->
  <rect x="520" y="210" width="50" height="65" rx="8" fill="#fb923c" stroke="#c2410c" stroke-width="2"/>
  <circle cx="545" cy="188" r="25" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <path d="M520 178 Q526 158 545 163 Q564 158 570 178" fill="#7c3aed" stroke="#5b21b6" stroke-width="1.5"/>
  <!-- wide worried eyes -->
  <circle cx="537" cy="186" r="5.5" fill="white"/>
  <circle cx="553" cy="186" r="5.5" fill="white"/>
  <circle cx="537" cy="187" r="2.5" fill="#1c1917"/>
  <circle cx="553" cy="187" r="2.5" fill="#1c1917"/>
  <!-- worry lines -->
  <line x1="533" y1="178" x2="535" y2="173" stroke="#92400e" stroke-width="1.5"/>
  <line x1="549" y1="178" x2="551" y2="173" stroke="#92400e" stroke-width="1.5"/>
  <!-- squiggly mouth -->
  <path d="M534 198 Q539 195 545 198 Q551 201 557 198" fill="none" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
  <!-- shrug arms -->
  <line x1="520" y1="225" x2="497" y2="208" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>
  <line x1="570" y1="225" x2="593" y2="208" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>
  <circle cx="495" cy="205" r="7" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="595" cy="205" r="7" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <!-- question marks floating -->
  <text x="570" y="175" font-size="18" fill="#ef4444">?</text>
  <text x="580" y="158" font-size="13" fill="#f97316">?</text>
  <text x="600" y="172" font-size="15" fill="#ef4444">?</text>
  <!-- legs -->
  <rect x="525" y="273" width="13" height="24" rx="5" fill="#c2410c"/>
  <rect x="546" y="273" width="13" height="24" rx="5" fill="#c2410c"/>

  <!-- Confused speech bubble -->
  <ellipse cx="548" cy="108" rx="72" ry="34" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <polygon points="524,140 517,156 540,146" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="548" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">Wait… is this right?</text>
  <text x="548" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">What does p=0.049</text>
  <text x="548" y="124" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">even mean?! 😰</text>

  <!-- Right caption -->
  <rect x="393" y="348" width="298" height="46" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="542" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">❌ But that's not all of it.</text>
  <text x="542" y="385" text-anchor="middle" font-size="12" fill="#991b1b">Understanding the output still needs YOU.</text>

  <!-- ===== PUNCHLINE BANNER ===== -->
  <rect x="30" y="420" width="660" height="65" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="3"/>
  <text x="360" y="445" text-anchor="middle" font-size="14" font-weight="bold" fill="#a5b4fc">🤖 AI writes the code. That's okay — use it!</text>
  <text x="360" y="466" text-anchor="middle" font-size="14" font-weight="bold" fill="#fde68a">🧠 But knowing what to ask, verify &amp; interpret? That's still on YOU.</text>

</svg>
